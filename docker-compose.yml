version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kariyerrotasi-db
    environment:
      POSTGRES_PASSWORD: kariyersifre
      POSTGRES_DB: kariyerrotasi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kariyerrotasi-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:kariyersifre@db:5432/kariyerrotasi?schema=public
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    container_name: kariyerrotasi-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:kariyersifre@db:5432/kariyerrotasi?schema=public
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./ai-service:/app
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kariyerrotasi-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: ba091ab6de50c868a60f73451e851c50932f5a40ed5426df362f71b0281237e3
